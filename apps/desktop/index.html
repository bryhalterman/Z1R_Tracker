<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Send no Referer with asset requests.

      The wiki that hosts the overworld map hotlink-protects it: a request
      carrying a Referer gets a 200x73 thumbnail instead of the 1280x468
      original, with a 200 status and no other sign anything is wrong. That
      is what made the map blurry in OBS and sharp everywhere else — the
      browser here happened not to send one, and OBS did.

      Set on the document because sprites are painted as CSS backgrounds,
      which cannot carry a per-element referrer policy.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z1R Tracker</title>
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body class="spectrum spectrum--dark spectrum--medium">
    <header class="page-header">
      <h1>Z1R Tracker</h1>
      <div id="controls"></div>
    </header>
    <main id="tracker"></main>
    <footer class="page-footer">
      <span id="mode-note">Items: left click adds, right click or Shift+click removes. Map: click a screen to pick a marker.</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
