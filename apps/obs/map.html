<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Send no Referer with asset requests.

      The wiki that hosts the overworld map hotlink-protects it: a request
      carrying a Referer gets a 200x73 thumbnail instead of the 1280x468
      original, with a 200 status and no other sign anything is wrong. That
      is what made the map blurry in OBS and sharp everywhere else — the
      browser here happened not to send one, and OBS did.

      Set on the document because sprites are painted as CSS backgrounds,
      which cannot carry a per-element referrer policy.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z1R Tracker — Overworld Map</title>
    <meta name="color-scheme" content="dark" />
  </head>
  <body class="dock spectrum spectrum--dark spectrum--medium">
    <!--
      The overworld map on its own, for docking beside the main dock.

      No controls bar: Export/Import/Reset live in the main dock, and a second
      Reset on a single-panel window is a way to lose a run by misclick.
    -->
    <main id="tracker"></main>
    <script type="module" src="/src/map.ts"></script>
  </body>
</html>
