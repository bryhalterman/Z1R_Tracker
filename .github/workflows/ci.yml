name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: the `cn` dependency declares `engines.node >=22`.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # The palette is literal values in theme.css; nothing else checks that
      # every rendered pair still clears WCAG AA.
      - name: Theme contrast
        run: npm run theme:check

      - name: Build all targets
        run: npm run build

      # Reports which sprite keys still fall back to glyphs. Never fails the
      # build — an unfilled key is a valid state, not an error.
      - name: Sprite coverage
        run: npm run sprites:check
